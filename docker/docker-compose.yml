# Levanta todo el backend: MySQL + 4 microservicios + gateway.
# Uso:  cp .env.example .env   (editar valores)   y luego:   docker compose up -d --build

x-bd: &bd
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USER: root
  DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en el archivo .env}

x-jwt: &jwt
  JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}

x-interno: &interno
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Define INTERNAL_API_KEY en el archivo .env}

services:

  mysql:
    image: mysql:8.4
    container_name: pasteleria-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en el archivo .env}
    ports:
      # 3307 en tu PC para no chocar con un MySQL local que ya use el 3306
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth:
    build: ./auth
    image: pasteleria/auth
    container_name: pasteleria-auth
    restart: unless-stopped
    environment:
      <<: [*bd, *jwt]
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@pasteleria.cl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en el archivo .env}
    ports:
      - "9080:9080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  producto:
    build: ./producto
    image: pasteleria/producto
    container_name: pasteleria-producto
    restart: unless-stopped
    environment:
      <<: [*bd, *jwt, *interno]
    ports:
      - "9081:9081"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  compra:
    build: ./compra
    image: pasteleria/compra
    container_name: pasteleria-compra
    restart: unless-stopped
    environment:
      <<: [*bd, *jwt, *interno]
      PRODUCTO_URL: http://producto:9081
    ports:
      - "9082:9082"
    depends_on:
      mysql:
        condition: service_healthy
      producto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  contenido:
    build: ./contenido
    image: pasteleria/contenido
    container_name: pasteleria-contenido
    restart: unless-stopped
    environment:
      <<: [*bd, *jwt]
    ports:
      - "9083:9083"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9083/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  gateway:
    build: ./gateway
    image: pasteleria/gateway
    container_name: pasteleria-gateway
    restart: unless-stopped
    environment:
      AUTH_URL: http://auth:9080
      PRODUCTO_URL: http://producto:9081
      COMPRA_URL: http://compra:9082
      CONTENIDO_URL: http://contenido:9083
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      auth:
        condition: service_healthy
      producto:
        condition: service_healthy
      compra:
        condition: service_healthy
      contenido:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  mysql_data:
