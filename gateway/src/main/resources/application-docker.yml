spring:
  cloud:
    gateway:
      routes:
        - id: auth
          uri: http://localhost:9080
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

        - id: compra
          uri: http://localhost:9081
          predicates:
            - Path=/compras/**

        - id: producto
          uri: http://localhost:9082
          predicates:
            - Path=/productos/**

        - id: contenido
          uri: http://localhost:9083
          predicates:
            - Path=/contenido/**

        