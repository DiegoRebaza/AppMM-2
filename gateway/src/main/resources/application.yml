server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        # --- Rutas de tus microservicios ---
        - id: auth-service
          uri: http://localhost:9080
          predicates:
            - Path=/auth/**
          filters:
            - JwtAuthFilter

        - id: producto-service
          uri: http://localhost:9081
          predicates:
            - Path=/productos/**
          filters:
            - JwtAuthFilter

        - id: compra-service
          uri: http://localhost:9082
          predicates:
            - Path=/compras/**
          filters:
            - JwtAuthFilter

        - id: contenido-service
          uri: http://localhost:9083
          predicates:
            - Path=/contenido/**
          filters:
            - JwtAuthFilter

        # Swagger
        - id: auth-openapi
          uri: http://localhost:9080
          predicates:
            - Path=/v3/api-docs/auth
          filters:
            - RewritePath=/v3/api-docs/auth, /v3/api-docs

        - id: producto-openapi
          uri: http://localhost:9081
          predicates:
            - Path=/v3/api-docs/producto
          filters:
            - RewritePath=/v3/api-docs/producto, /v3/api-docs

        - id: compra-openapi
          uri: http://localhost:9082
          predicates:
            - Path=/v3/api-docs/compra
          filters:
            - RewritePath=/v3/api-docs/compra, /v3/api-docs

        - id: contenido-openapi
          uri: http://localhost:9083
          predicates:
            - Path=/v3/api-docs /contenido
          filters:
            - RewritePath=/v3/api-docs/contenido, /v3/api-docs

# --- Configuración de Swagger UI centralizado ---
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /v3/api-docs/auth
      - name: Producto Service
        url: /v3/api-docs/producto
      - name: Compra Service
        url: /v3/api-docs/compra
      - name: Contenido Service
        url: /v3/api-docs/contenido